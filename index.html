<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="profile">
        <img src="./imagens/Avatar.png" />
        <p class="profile">Guilherme Meurer</p>
      </div>
      <div>
        <ul class="list">
          <li>
            <a href="#">Meu Portifólio</a>
          </li>

          <li>
            <a href="https://github.com" target="_blank">Github</a>
          </li>

          <li>
            <a href="https://wa.me/qr/KBK7VMELT75UH1" target="_blank"
              >WhatsApp</a
            >
          </li>

          <li>
            <a
              href="https://www.instagram.com/gui.meurerr?stkn=ZjhvOGF3dGN3N2wx"
              target="_blank"
              >Instagram</a
            >
            <!--o atributo target blank faz com que quando o usuario clique no link ele seja levado para uma nova janela do navegador-->
          </li>
        </ul>
      </div>

      <div class="icones">
        <ion-icon name="person-circle-outline" class="portifolio"></ion-icon>

        <a href="https://github.com/" target="_blank">
          <ion-icon name="logo-github" class="github"></ion-icon
        ></a>

        <a href="https://wa.me/qr/KBK7VMELT75UH1" target="_blank">
          <ion-icon name="logo-whatsapp" class="whatsapp"></ion-icon
        ></a>

        <a
          href="https://www.instagram.com/gui.meurerr?stkn=ZjhvOGF3dGN3N2wx"
          target="_blank"
        >
          <ion-icon name="logo-instagram" class="instagram"></ion-icon
        ></a>
      </div>
    </div>

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>

    <script src="script.js"></script>
  </body>
</html>
